name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check frontend modules
        run: |
          node --check public/utils.js
          node --check public/api.js
          node --check public/chart.js
          node --check public/table.js
          node --check public/app.js
      - name: Run automated tests with coverage
        run: npm run test:coverage
